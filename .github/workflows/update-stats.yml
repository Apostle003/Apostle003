name: Update GitHub Readme Stats

on:
  schedule:
    - cron: '0 0 * * *' # 毎日日本時間の午前9時に自動実行
  workflow_dispatch: # 手動実行も可能にする設定

permissions:
  contents: write # 画像をリポジトリに書き込むために必要

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 言語ランキングカードの生成
      - name: Generate Top Languages Card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          token: ${{ secrets.PROFILE_STATS_TOKEN }}
          options: layout=compact&theme=radical # レイアウトやテーマはお好みで

      # 生成された画像をリポジトリに反映してコミットする
      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update github readme stats" && git push)